<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퍼센트 계산기</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── 컬러 토큰 ── */
:root {
  --bg:      #f3f3f6;
  --surf:    #ffffff;
  --surf2:   #ededf1;
  --bd:      #e0e0e8;
  --bd2:     #c4c4d0;
  --t1:      #0c0c14;
  --t2:      #1c1c30;
  --t3:      #50506c;
  --t4:      #9090aa;
  --blue:    #1d4ed8;
  --blue-bg: #dbeafe;
  --bar:     #e0e0e8;
  --sh1: 0 1px 3px rgba(0,0,0,.07), 0 0 0 1px rgba(0,0,0,.04);
  --sh2: 0 4px 16px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
}
[data-theme="dark"] {
  --bg:      #0e0e13;
  --surf:    #18181f;
  --surf2:   #222230;
  --bd:      #2e2e40;
  --bd2:     #42425a;
  --t1:      #ffffff;
  --t2:      #ffffff;
  --t3:      #e0e0f4;
  --t4:      #c8c8e0;
  --blue:    #60a5fa;
  --blue-bg: #1a2a48;
  --bar:     #2e2e40;
  --sh1: 0 1px 3px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
  --sh2: 0 4px 16px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
}

/* ── 기본 ── */
body {
  font-family: 'Pretendard Variable', Pretendard, sans-serif;
  background: var(--bg);
  color: var(--t1);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background .2s, color .2s;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 48px 20px 80px;
}

/* ── 헤더 ── */
.header { margin-bottom: 32px; }

.header-topbar {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin-bottom: 14px;
}

.theme-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 13px;
  border-radius: 99px;
  border: 1px solid var(--bd2);
  background: var(--surf);
  color: var(--t3);
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  box-shadow: var(--sh1);
  white-space: nowrap;
}
.theme-btn:hover { color: var(--t1); border-color: var(--t3); }

.header-title {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.03em;
  color: var(--t1);
  line-height: 1;
  text-align: center;
}
.header-sub {
  font-size: 13px;
  font-weight: 400;
  color: var(--t4);
  text-align: center;
  margin-top: 8px;
}

/* ── 기준 인원 선택 ── */
.pick {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 10px;
}
.pick-btn {
  background: var(--surf);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: var(--sh1);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.pick-btn:hover { border-color: var(--bd2); }
.pick-lbl {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--t4);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.pick-num {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.02em;
  color: var(--t3);
  line-height: 1.1;
}
.pick-num small { font-size: 13px; font-weight: 600; margin-left: 2px; }
.pick-btn.active {
  background: var(--blue-bg);
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-bg), var(--sh1);
}
.pick-btn.active .pick-lbl,
.pick-btn.active .pick-num { color: var(--blue); }
.pick-custom { cursor: text; }
.pick-custom .pick-num { display: flex; align-items: baseline; }
.pick-custom input {
  background: transparent;
  border: none;
  outline: none;
  font: inherit;
  color: inherit;
  width: 100%;
  min-width: 0;
  -moz-appearance: textfield;
}
.pick-custom input::-webkit-outer-spin-button,
.pick-custom input::-webkit-inner-spin-button { -webkit-appearance: none; }
.pick-custom input::placeholder { color: var(--bd2); }

/* ── 입력 카드 ── */
.input-card {
  background: var(--surf);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 22px 22px 18px;
  box-shadow: var(--sh1);
  margin-bottom: 10px;
  transition: border-color .15s, box-shadow .15s;
}
.input-card:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-bg), var(--sh1);
}
.ic-lbl {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--t4);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.ic-row {
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.ic-row input {
  background: transparent;
  border: none;
  outline: none;
  font-family: inherit;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -.03em;
  color: var(--t1);
  width: 100%;
  min-width: 0;
  -moz-appearance: textfield;
}
.ic-row input::-webkit-outer-spin-button,
.ic-row input::-webkit-inner-spin-button { -webkit-appearance: none; }
.ic-row input::placeholder { color: var(--bd2); }
.ic-unit {
  font-size: 13px;
  font-weight: 600;
  color: var(--t4);
  white-space: nowrap;
  flex-shrink: 0;
}
.ic-hint {
  font-size: 11px;
  font-weight: 400;
  color: var(--t4);
  margin-top: 6px;
}

/* ── 결과 보드 ── */
.result-board {
  background: var(--surf);
  border: 1px solid var(--bd);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--sh2);
  position: relative;
}
.result-board::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--bar); transition: background .3s;
}
.rb-top {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.rb-col { padding: 26px 24px 22px; }
.rb-col + .rb-col { border-left: 1px solid var(--bd); }
.rb-lbl {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--t4);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.rb-pct {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -.035em;
  line-height: 1;
  color: var(--t4);
  white-space: nowrap;
}
.rb-pct.on { color: var(--blue); }
/* ── 반응형 ── */
@media (max-width: 500px) {
  .wrap { padding: 28px 14px 60px; }
  .header-topbar { margin-bottom: 10px; }
  .header-title { font-size: 22px; }
  .pick { grid-template-columns: repeat(2, 1fr); }
  .pick-btn { padding: 14px 14px; }
  .pick-num { font-size: 19px; }
  .ic-row input { font-size: 28px; }
  .rb-pct { font-size: 36px; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 헤더 -->
  <div class="header">
    <div class="header-topbar">
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="themeIcon">☀️</span>
        <span id="themeLabel">라이트 모드</span>
      </button>
    </div>
    <div class="header-title">퍼센트 계산기</div>
    <div class="header-sub">퍼센트 → 인원 · 소수점 첫째 자리 반올림</div>
  </div>

  <!-- 기준 인원 -->
  <div class="pick">
    <div class="pick-btn pick-custom active" data-val="custom" onclick="$('customBase').focus()">
      <div class="pick-lbl">직접 입력</div>
      <div class="pick-num"><input type="number" id="customBase" placeholder="00" min="1" step="1" inputmode="numeric"><small>명</small></div>
    </div>
    <button class="pick-btn" data-val="15" onclick="setBase(15)">
      <div class="pick-lbl">전체</div>
      <div class="pick-num">15<small>명</small></div>
    </button>
    <button class="pick-btn" data-val="18" onclick="setBase(18)">
      <div class="pick-lbl">전체</div>
      <div class="pick-num">18<small>명</small></div>
    </button>
    <button class="pick-btn" data-val="24" onclick="setBase(24)">
      <div class="pick-lbl">전체</div>
      <div class="pick-num">24<small>명</small></div>
    </button>
  </div>

  <!-- 입력 -->
  <div class="input-card">
    <span class="ic-lbl" id="inLbl">퍼센트</span>
    <div class="ic-row">
      <input type="number" id="val" placeholder="0" min="0" step="any" inputmode="decimal">
      <span class="ic-unit" id="inUnit">%</span>
    </div>
    <div class="ic-hint" id="hint">전체 인원을 먼저 입력하세요</div>
  </div>

  <!-- 결과 -->
  <div class="result-board" id="resultBoard">
    <div class="rb-top">
      <div class="rb-col">
        <div class="rb-lbl">퍼센트</div>
        <div class="rb-pct" id="rRatio">—</div>
      </div>
      <div class="rb-col">
        <div class="rb-lbl">인원</div>
        <div class="rb-pct" id="rCnt">—</div>
      </div>
    </div>
  </div>

</div>
<script>
const $ = id => document.getElementById(id);
let dk = true;
let base = 0;

function toggleTheme() {
  dk = !dk;
  document.documentElement.setAttribute('data-theme', dk ? 'dark' : 'light');
  $('themeIcon').textContent  = dk ? '☀️' : '🌙';
  $('themeLabel').textContent = dk ? '라이트 모드' : '다크 모드';
}

function setBase(val, custom = false) {
  base = val;
  document.querySelectorAll('.pick-btn').forEach(b => {
    b.classList.toggle('active', custom ? b.dataset.val === 'custom' : parseInt(b.dataset.val) === val);
  });
  if (!custom) $('customBase').value = '';
  calc();
}

$('customBase').addEventListener('input', e => {
  const v = parseInt(e.target.value) || 0;
  if (v > 0) setBase(v, true);
  else { base = 0; document.querySelectorAll('.pick-btn').forEach(b => b.classList.toggle('active', b.dataset.val === 'custom')); calc(); }
});
$('customBase').addEventListener('keydown', e => { if (e.key === 'Enter') $('val').focus(); });

// 소수점 첫째 자리 반올림 (nn.n) — 13.7499999… 같은 부동소수 오차를 먼저 정리
const r1  = n => Math.round(Number((n * 10).toPrecision(12))) / 10;
const num = n => r1(n).toLocaleString('ko-KR', {maximumFractionDigits: 1});

function calc() {
  const val = parseFloat($('val').value) || 0;
  $('hint').textContent = base > 0
    ? '전체 ' + base + '명의 몇 %인지 입력하세요'
    : '전체 인원을 먼저 입력하세요';

  const on = val > 0 && base > 0;
  $('rRatio').textContent = on ? num(val) + '%' : '—';
  $('rCnt').textContent   = on ? num(base * val / 100) + '명' : '—';
  $('rRatio').classList.toggle('on', on);
  $('rCnt').classList.toggle('on', on);
  $('resultBoard').style.setProperty('--bar', on ? 'var(--blue)' : 'var(--bd)');
}

$('val').addEventListener('input', calc);
calc();
$('customBase').focus();
</script>
</body>
</html>
